version: "3.8"

services:
  terraform:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ~/.ssh:/home/terraform/.ssh:ro
    environment:
      - TF_LOG=${TF_LOG:-}
      - TF_VAR_proxmox_password=${TF_VAR_proxmox_password}
    entrypoint: terraform
